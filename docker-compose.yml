services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: cifracontrol-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-cifracontrol}
      - POSTGRES_USER=${POSTGRES_USER:-cifracontrol}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cifracontrol}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cifracontrol} -d ${POSTGRES_DB:-cifracontrol}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    # Sin puertos publicados: la base de datos sólo es accesible desde la red de Compose.

  dashboard:
    build: .
    image: cifracontrol-dashboard:latest
    container_name: cifracontrol
    ports:
      - "3000:3000"
    environment:
      - SIMULATED_DELAY_MS=900
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=${POSTGRES_USER:-cifracontrol}
      - PGPASSWORD=${POSTGRES_PASSWORD:-cifracontrol}
      - PGDATABASE=${POSTGRES_DB:-cifracontrol}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  uploads_data:
  pg_data:
